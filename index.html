<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Scene Lead Design Lab</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap');

:root{
  color-scheme:light;
  --bg:#f4f5fa;--surface:#ffffff;--surface-2:#f1f3f8;--surface-3:#e6e9f2;
  --border:#dde1eb;--border-strong:#c3c9da;
  --text:#131829;--text-muted:#535b73;--text-subtle:#69718a;
  --primary:#3450f0;--primary-hover:#2a41cc;--primary-soft:#eceffe;--on-primary:#ffffff;
  --accent:#bf4526;--accent-soft:#fdeee9;
  --success:#116e3e;--success-bg:#e3f6ec;
  --warning:#8a5800;--warning-bg:#fdf1dc;
  --danger:#b8352a;--danger-bg:#fbe8e6;
  --neutral:#5e6577;--neutral-bg:#eceef3;
  --bar-past:#c5cbd9;--bar-active:#3450f0;--bar-open:#1d8a52;--bar-future:#e4e7ef;--bar-future-line:#b6bdcd;--bar-text-on:#ffffff;--bar-text-off:#3b4256;
  --av1-bg:#fde3dc;--av1:#9a3418;--av2-bg:#dfe6fd;--av2:#2a41cc;--av3-bg:#dcf3e6;--av3:#13603a;--av4-bg:#efe3fb;--av4:#6b3aa6;
  --anno-bg:#fff4dc;--anno-text:#7a4b00;--anno-line:#d9a441;
  --sim-bg:#fdf1dc;--sim-text:#7a4b00;
  --lab-bg:#0b1020;--lab-surface:#161c30;--lab-line:#283049;--lab-text:#eef1f8;--lab-muted:#a7b0c8;--lab-accent:#ffb86b;--lab-on-accent:#1a1205;
  --scrim:rgba(11,16,32,.48);--tour-dim:rgba(8,11,22,.42);
  --phone-bezel:#10131c;--phone-edge:#2c3245;
  --hero-a:#eef1fe;--hero-b:#fdeee9;--hero-line:#d6dcfb;
  --today-line:#bf4526;
  --cta:#3450f0;--cta-hover:#2a41cc;--on-cta:#ffffff;
  --brand-mark:#bf4526;--on-brand-mark:#ffffff;--sl-mark:#3450f0;
  --shadow-sm:0 1px 2px rgba(15,20,45,.06);
  --shadow:0 1px 3px rgba(15,20,45,.07),0 8px 20px -14px rgba(15,20,45,.25);
  --shadow-lg:0 2px 8px rgba(15,20,45,.08),0 24px 48px -22px rgba(15,20,45,.38);
  --ring:rgba(52,80,240,.42);
  --plan-bg:#eaf5f2;--plan-line:#9ccdc2;--plan-text:#0f5a4f;--ipad-bezel:#1a1d26;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1018;--surface:#161a24;--surface-2:#1d2230;--surface-3:#282f3e;
    --border:#2e3546;--border-strong:#444d62;
    --text:#eef1f8;--text-muted:#a7b0c4;--text-subtle:#8d97ad;
    --primary:#8098ff;--primary-hover:#98abff;--primary-soft:#1d2545;--on-primary:#0b0e14;
    --accent:#ff9273;--accent-soft:#3a211a;
    --success:#5fd394;--success-bg:#123222;
    --warning:#f0c46b;--warning-bg:#33280f;
    --danger:#ff7b6b;--danger-bg:#3a1f1c;
    --neutral:#a3abbd;--neutral-bg:#252b37;
    --bar-past:#3a4256;--bar-active:#6f88ff;--bar-open:#3fb57a;--bar-future:#222836;--bar-future-line:#4a5368;--bar-text-on:#0b0e14;--bar-text-off:#c3cada;
    --av1-bg:#45241b;--av1:#ffb39e;--av2-bg:#1f2849;--av2:#a9b8ff;--av3-bg:#16332a;--av3:#8fe0b3;--av4-bg:#2e2340;--av4:#d2b5f5;
    --anno-bg:#33280f;--anno-text:#f3cd7d;--anno-line:#8a6a2c;
    --sim-bg:#33280f;--sim-text:#f3cd7d;
    --lab-bg:#05070d;--lab-surface:#11162a;--lab-line:#232b44;--lab-text:#eef1f8;--lab-muted:#a7b0c8;--lab-accent:#ffb86b;--lab-on-accent:#1a1205;
    --scrim:rgba(0,0,0,.6);--tour-dim:rgba(0,0,0,.55);
    --phone-bezel:#000000;--phone-edge:#2c3245;
    --hero-a:#1b2340;--hero-b:#2e1d18;--hero-line:#26305a;
    --today-line:#ff9273;
    --cta:#8098ff;--cta-hover:#98abff;--on-cta:#0b0e14;
    --brand-mark:#ff9273;--on-brand-mark:#1a0d08;--sl-mark:#8098ff;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 3px rgba(0,0,0,.45),0 8px 20px -14px rgba(0,0,0,.6);
    --shadow-lg:0 18px 40px -20px rgba(0,0,0,.75);
    --ring:rgba(128,152,255,.5);
  --plan-bg:#10282a;--plan-line:#2c6a62;--plan-text:#8fe0d0;--ipad-bezel:#000000;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1018;--surface:#161a24;--surface-2:#1d2230;--surface-3:#282f3e;
  --border:#2e3546;--border-strong:#444d62;
  --text:#eef1f8;--text-muted:#a7b0c4;--text-subtle:#8d97ad;
  --primary:#8098ff;--primary-hover:#98abff;--primary-soft:#1d2545;--on-primary:#0b0e14;
  --accent:#ff9273;--accent-soft:#3a211a;
  --success:#5fd394;--success-bg:#123222;
  --warning:#f0c46b;--warning-bg:#33280f;
  --danger:#ff7b6b;--danger-bg:#3a1f1c;
  --neutral:#a3abbd;--neutral-bg:#252b37;
  --bar-past:#3a4256;--bar-active:#6f88ff;--bar-open:#3fb57a;--bar-future:#222836;--bar-future-line:#4a5368;--bar-text-on:#0b0e14;--bar-text-off:#c3cada;
  --av1-bg:#45241b;--av1:#ffb39e;--av2-bg:#1f2849;--av2:#a9b8ff;--av3-bg:#16332a;--av3:#8fe0b3;--av4-bg:#2e2340;--av4:#d2b5f5;
  --anno-bg:#33280f;--anno-text:#f3cd7d;--anno-line:#8a6a2c;
  --sim-bg:#33280f;--sim-text:#f3cd7d;
  --lab-bg:#05070d;--lab-surface:#11162a;--lab-line:#232b44;--lab-text:#eef1f8;--lab-muted:#a7b0c8;--lab-accent:#ffb86b;--lab-on-accent:#1a1205;
  --scrim:rgba(0,0,0,.6);--tour-dim:rgba(0,0,0,.55);
  --phone-bezel:#000000;--phone-edge:#2c3245;
  --hero-a:#1b2340;--hero-b:#2e1d18;--hero-line:#26305a;
  --today-line:#ff9273;
  --cta:#8098ff;--cta-hover:#98abff;--on-cta:#0b0e14;
  --brand-mark:#ff9273;--on-brand-mark:#1a0d08;--sl-mark:#8098ff;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 3px rgba(0,0,0,.45),0 8px 20px -14px rgba(0,0,0,.6);
  --shadow-lg:0 18px 40px -20px rgba(0,0,0,.75);
  --ring:rgba(128,152,255,.5);
  --plan-bg:#10282a;--plan-line:#2c6a62;--plan-text:#8fe0d0;--ipad-bezel:#000000;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:15px;height:15px}
.ic.lg{width:22px;height:22px}
.muted{color:var(--text-muted)}
.subtle{color:var(--text-subtle)}
.num{font-variant-numeric:tabular-nums}

#dl-root{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:28px;overflow-x:clip;min-height:100vh}

/* ============ Design Lab bar (not product UI) ============ */
.lab{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--lab-bg);color:var(--lab-text);box-shadow:0 0 0 100vmax var(--lab-bg);clip-path:inset(0 -100vmax);display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:9px 0;min-height:58px;border-bottom:1px solid var(--lab-line)}
.lab :focus-visible{outline-color:var(--lab-accent)}
.lab-brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.lab-mark{width:32px;height:32px;border-radius:9px;background:var(--lab-accent);color:var(--lab-on-accent);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em;flex:none}
.lab-title{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.lab-title b{font-size:14.5px;font-weight:650}
.lab-title span{font-size:12px;color:var(--lab-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab-field{display:flex;align-items:center;gap:8px}
.lab-lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--lab-muted);font-weight:600}
.lab select{background:var(--lab-surface);border:1px solid var(--lab-line);color:var(--lab-text);border-radius:9px;padding:0 30px 0 10px;height:36px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--lab-muted) 50%),linear-gradient(135deg,var(--lab-muted) 50%,transparent 50%);background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat;font-weight:550;cursor:pointer}
.lab-seg{display:inline-flex;background:var(--lab-surface);border:1px solid var(--lab-line);border-radius:10px;padding:3px;gap:2px}
.lab-seg button{border:0;background:transparent;color:var(--lab-muted);padding:0 12px;height:30px;border-radius:7px;font-weight:600;cursor:pointer;white-space:nowrap}
.lab-seg button[aria-pressed="true"]{background:var(--lab-accent);color:var(--lab-on-accent)}
.lab-optdesc{font-size:12.5px;color:var(--lab-muted);max-width:210px;line-height:1.2}
.lab-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;position:relative}
.lab-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--lab-line);background:var(--lab-surface);color:var(--lab-text);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none}
.lab-btn:hover{text-decoration:none;border-color:var(--lab-muted)}
.lab-btn[aria-pressed="true"]{border-color:var(--lab-accent);color:var(--lab-accent)}
.lab-btn.primary{background:var(--lab-accent);color:var(--lab-on-accent);border-color:var(--lab-accent)}
.lab-btn.icon{width:36px;padding:0;justify-content:center}
.lab-btn .cnt{background:var(--lab-on-accent);color:var(--lab-accent);border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}
.lab-more{display:none}
.lab-menu{position:absolute;right:0;top:44px;background:var(--lab-bg);border:1px solid var(--lab-line);border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:210px;box-shadow:var(--shadow-lg);z-index:70}
.lab-menu .lab-btn{border:0;background:transparent;justify-content:flex-start;height:44px;width:100%}
@media (max-width:1180px){.lab-optdesc{display:none}}
@media (max-width:980px){
  .lab-wide{display:none!important}
  .lab-more{display:inline-flex}
}
@media (max-width:620px){
  .lab{gap:8px;padding:8px 0}
  .lab-title span,.lab-lbl,.lab-txt{display:none}
  .lab-title b{font-size:13px}
  .lab-brand{margin-right:0;flex:1 1 auto}
  .lab select{max-width:128px;height:40px}
  .lab-seg button{height:34px;padding:0 10px}
  .lab-btn{height:40px;padding:0 10px}
  .lab-btn.icon{width:40px}
}
@media (max-width:400px){.lab-title{display:none}}

/* ============ Product shell ============ */
.shell{display:grid;grid-template-columns:auto minmax(0,1fr);background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-top:16px;min-height:calc(100vh - var(--lab-h,58px) - 44px);box-shadow:var(--shadow)}
.side{position:sticky;top:calc(var(--lab-h,58px) + env(safe-area-inset-top,0px) + 16px);align-self:start;width:252px;max-height:calc(100vh - var(--lab-h,58px) - 34px);overflow:auto;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px 10px;border-radius:16px 0 0 16px;background:var(--surface);transition:width .18s ease}
.side.collapsed{width:68px}
.side-head{display:flex;align-items:center;gap:10px;padding:4px 4px 10px}
.studio-mark{width:34px;height:34px;border-radius:10px;background:var(--brand-mark);color:var(--on-brand-mark);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.side-studio{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1}
.side-studio b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-studio small{font-size:12px;color:var(--text-muted)}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text-muted);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.side-opt{margin:0 4px 10px;font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--anno-text);background:var(--anno-bg);border:1px dashed var(--anno-line);border-radius:8px;padding:4px 8px}
.side.collapsed .side-studio,.side.collapsed .side-opt,.side.collapsed .nv span,.side.collapsed .nv .chev,.side.collapsed .nv-kids,.side.collapsed .nv .badge,.side.collapsed .nv-sub,.side.collapsed .side-foot .foot-txt{display:none}
.side.collapsed .side-head{flex-direction:column}
.side-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nv{display:flex;align-items:center;gap:11px;width:100%;min-height:38px;padding:0 10px;border-radius:9px;border:0;background:transparent;color:var(--text-muted);font-weight:550;font-size:14px;text-align:left;cursor:pointer;text-decoration:none}
.nv:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.nv[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:650}
.nv.in-path{color:var(--text)}
.nv span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv .chev{transition:transform .15s}
.nv[aria-expanded="true"] .chev{transform:rotate(90deg)}
.nv .badge{font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 7px;line-height:19px}
.nv-kids{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 20px;padding-left:10px;border-left:1px solid var(--border)}
.nv.kid{min-height:34px;font-size:13.5px;font-weight:500;padding:0 10px}
.nv .new{font-size:10.5px;font-weight:700;color:var(--success);background:var(--success-bg);border-radius:5px;padding:0 5px;line-height:17px;letter-spacing:.03em}
.nv-sub{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-subtle);padding:8px 10px 2px}
.side-foot{border-top:1px solid var(--border);padding-top:8px;margin-top:10px;display:flex;flex-direction:column;gap:2px}
.side.collapsed .nv{justify-content:center;padding:0}
.main-wrap{min-width:0;display:flex;flex-direction:column}
.appbar{display:none}
.main{padding:26px 30px 48px;min-width:0;outline:none}
.main-in{max-width:1180px;margin:0 auto}
.bbar{display:none}

@media (max-width:859px){
  .shell{grid-template-columns:minmax(0,1fr);border-radius:14px;margin-top:12px}
  .side{display:none}
  .appbar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border);min-height:56px}
  .appbar .ttl{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1}
  .appbar .ttl b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .appbar .ttl small{font-size:12px;color:var(--text-muted)}
  .appbar .icon-btn{width:44px;height:44px}
  .main{padding:20px 16px 36px}
  .bbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--border);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-shadow:0 -6px 18px -14px var(--scrim)}
  .bbar a,.bbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:0;background:transparent;color:var(--text-muted);font-size:11.5px;font-weight:600;text-decoration:none;cursor:pointer;border-radius:10px;padding:0 2px;text-align:center;line-height:1.15}
  .bbar a[aria-current="page"]{color:var(--primary)}
  .bbar span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #dl-root.has-bbar{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
}
.opt-chip{font-size:11.5px;font-weight:700;color:var(--anno-text);background:var(--anno-bg);border:1px dashed var(--anno-line);border-radius:7px;padding:2px 7px;white-space:nowrap}

/* Drawer */
.drawer{position:fixed;inset:0;z-index:80}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.drawer-panel{position:absolute;left:0;top:0;bottom:0;width:min(330px,88vw);background:var(--surface);padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(16px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));overflow:auto;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer .nv{min-height:44px}
.drawer .nv.kid{min-height:44px}

/* ============ Page header, tabs, controls ============ */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.ph-txt{min-width:0;flex:1 1 380px}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);margin-bottom:4px;flex-wrap:wrap}
.crumb a{color:var(--text-muted)}
.crumb a:hover{color:var(--primary)}
.ph h2{font-size:27px;font-weight:650;letter-spacing:-.018em;outline:none}
.ph-desc{margin-top:6px;color:var(--text-muted);max-width:66ch}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;margin:0 0 20px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;padding:0 12px;min-height:44px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--text-muted);font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer;text-decoration:none;margin-bottom:-1px}
.tab:hover{color:var(--text);text-decoration:none}
.tab[aria-current="page"],.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--primary)}
.tab .n{font-size:12px;font-weight:700;background:var(--surface-3);color:var(--text-muted);border-radius:999px;padding:0 7px;line-height:19px}
.tab[aria-selected="true"] .n{background:var(--primary-soft);color:var(--primary)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button,.seg a{border:0;background:transparent;padding:0 12px;min-height:34px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.seg button[aria-pressed="true"],.seg a[aria-current="page"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}

.sim{display:inline-flex;align-items:center;font-size:10.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;background:var(--sim-bg);color:var(--sim-text);border-radius:5px;padding:0 6px;line-height:18px;white-space:nowrap;vertical-align:middle}

.grid{display:grid;gap:14px}

/* Home */
.weekline{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:12px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);margin-bottom:16px;font-size:14px;color:var(--text-muted)}

.qa{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:14px;color:var(--text);cursor:pointer;text-align:left;text-decoration:none}

.future{border:1px solid var(--border);border-radius:14px;margin-top:22px;background:var(--surface)}

.lg-past{background:var(--bar-past)}.lg-active{background:var(--bar-active)}.lg-open{background:var(--bar-open)}.lg-future{background:var(--bar-future);border:1px dashed var(--bar-future-line)}

/* Program detail */

@media (max-width:420px){.facts{grid-template-columns:minmax(0,1fr)}}

}

.tick{width:32px;height:32px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;color:transparent;flex:none}

.ci-btn{min-width:116px}

.drow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--border);min-height:60px;background:var(--surface)}

.drow .rn{flex:1;min-width:0}

.dgroup{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px}

@media (max-width:520px){.drow{flex-wrap:wrap}.drow .ci-btn{width:100%}}
.teach-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:20px;border-radius:16px;border:1px solid var(--border);background:var(--surface-2);margin-bottom:16px}

.teach-hero h3{font-size:20px;font-weight:650}
.teach-hero .big-time{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}

/* Settings hub, details, misc pages */
.hub-sec{margin-bottom:22px}
.hub-sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);font-weight:700;margin-bottom:10px}
.hub-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);text-decoration:none;min-height:64px;cursor:pointer;text-align:left;width:100%}
.hub-card:hover{border-color:var(--primary);text-decoration:none}
.hub-card .hi{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--text-muted);flex:none}
.hub-card b{display:block;font-size:14.5px}
.hub-card small{display:block;color:var(--text-muted);font-size:13px}
.hub-card .path{font-size:12px;color:var(--primary);font-weight:600}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .wide{grid-column:1/-1}
@media (max-width:640px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.form-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}
.suggest{border:1px solid var(--border);border-radius:10px;margin-top:4px;overflow:hidden;background:var(--surface)}
.suggest button{display:flex;width:100%;gap:10px;align-items:center;padding:0 12px;min-height:44px;border:0;border-top:1px solid var(--border);background:transparent;text-align:left;cursor:pointer;font-weight:500}
.suggest button:first-child{border-top:0}
.suggest button:hover{background:var(--surface-2)}
.placeholder{display:flex;gap:16px;align-items:flex-start;padding:22px;border:1px dashed var(--border-strong);border-radius:14px;background:var(--surface-2)}
.placeholder .pi{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--text-muted);flex:none;border:1px solid var(--border)}
.where{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:640px){.where{grid-template-columns:minmax(0,1fr)}}
.where div{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:13.5px}
.where span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.site-prev{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.site-prev .sp-bar{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:12px;color:var(--text-muted)}
.site-prev .sp-bar i{width:8px;height:8px;border-radius:50%;background:var(--border-strong)}
.site-prev .sp-hero{padding:22px;background:repeating-linear-gradient(120deg,var(--hero-a) 0 22px,var(--hero-b) 22px 44px)}
.site-prev .sp-hero b{display:block;font-size:20px}
.site-prev .sp-lines{padding:14px 22px;display:flex;flex-direction:column;gap:8px}
.site-prev .sp-lines i{height:8px;border-radius:4px;background:var(--surface-3);display:block}

/* Student registration */
.stage{display:grid;grid-template-columns:auto minmax(0,420px);gap:36px;justify-content:center;align-items:start;padding:22px 0 10px}
.phone{width:390px;height:min(820px,calc(100vh - var(--lab-h,58px) - 60px));min-height:560px;border-radius:48px;background:var(--phone-bezel);padding:11px;box-shadow:var(--shadow-lg),inset 0 0 0 2px var(--phone-edge);position:sticky;top:calc(var(--lab-h,58px) + 20px)}
.phone .screen{height:100%;border-radius:38px;overflow:auto;background:var(--surface);position:relative;display:flex;flex-direction:column;scrollbar-width:thin}
.stage-notes{padding-top:12px}
.stage-notes h2{font-size:24px;letter-spacing:-.015em;margin-bottom:8px}
.stage-notes li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:14px;color:var(--text-muted)}
.stage-notes li b{color:var(--text)}
.stage-notes li .ic{color:var(--primary);margin-top:2px}
@media (max-width:899px){.stage{grid-template-columns:minmax(0,1fr)}.stage-notes{display:none}}
@media (max-width:699px){
  .stage{padding:0;margin:12px 0 0}
  .phone{width:auto;height:auto;min-height:0;border-radius:16px;padding:0;background:transparent;box-shadow:none;position:static}
  .phone .screen{border-radius:16px;overflow:visible;border:1px solid var(--border);min-height:calc(100vh - var(--lab-h,58px) - 40px)}
}
.m-top{display:flex;align-items:center;gap:10px;padding:16px 18px 8px;position:sticky;top:0;background:var(--surface);z-index:5}
.m-top b{font-size:15px;flex:1}
.m-chips{display:flex;gap:6px;overflow-x:auto;padding:4px 18px 10px;scrollbar-width:none}
.m-chips::-webkit-scrollbar{display:none}
.m-chips .chip{min-height:40px;flex:none}
.m-hero{margin:4px 14px 0;border-radius:20px;padding:20px 18px;background:repeating-linear-gradient(120deg,var(--hero-a) 0 26px,var(--surface) 26px 30px);border:1px solid var(--hero-line)}
.m-hero h1{font-size:28px;letter-spacing:-.02em;font-weight:700;margin-top:10px}
.m-hero p{color:var(--text-muted);margin-top:2px;font-size:14px}
.m-body{padding:4px 18px 8px;flex:1}
.m-facts li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--border);font-size:15px}
.m-facts li:first-child{border-top:0}
.m-facts .ic{color:var(--text-muted);margin-top:2px}
.m-facts small{display:block;color:var(--text-muted);font-size:13px}
.m-avail{border-radius:14px;padding:12px 14px;margin:6px 0 4px;background:var(--success-bg);color:var(--success)}
.m-avail.full{background:var(--warning-bg);color:var(--warning)}
.m-avail b{font-size:15px}
.m-avail .bar{margin-top:8px;background:var(--surface)}
.m-sec{padding:18px 0 4px}
.m-sec h2{font-size:17px;font-weight:700;margin-bottom:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);text-align:left;cursor:pointer;margin-bottom:8px;min-height:64px}
.opt[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);flex:none;margin-top:1px;display:grid;place-items:center}
.opt[aria-checked="true"] .radio{border-color:var(--primary)}
.opt[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.opt .ot{flex:1}
.opt .ot b{display:block;font-size:15px}
.opt .ot small{display:block;color:var(--text-muted);font-size:13px}
.opt .op{font-weight:700;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.opt .op s{display:block;font-weight:500;font-size:12.5px;color:var(--text-muted)}
.m-weeks li{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--border);font-size:14px}
.m-weeks li:first-child{border-top:0}
.m-weeks .wn{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.m-weeks small{display:block;color:var(--text-muted);font-size:12.5px}
.cta{position:sticky;bottom:0;z-index:6;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -10px 24px -18px var(--scrim)}
.cta-sum{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--text-muted);margin-bottom:8px;gap:8px}
.cta-sum b{color:var(--text);font-size:15px}
.btn-cta{width:100%;min-height:58px;border:0;border-radius:16px;background:var(--cta);color:var(--on-cta);font-weight:700;font-size:17.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-cta:hover{background:var(--cta-hover)}
.m-steps{display:flex;gap:6px;padding:0 18px 6px}
.m-steps i{flex:1;height:4px;border-radius:2px;background:var(--surface-3)}
.m-steps i.on{background:var(--primary)}
.m-steplbl{padding:4px 18px 4px;font-size:13px;color:var(--text-muted)}
.paybanner{border:2px dashed var(--warning);background:var(--warning-bg);color:var(--warning);border-radius:14px;padding:14px;font-weight:650;display:flex;gap:10px;align-items:flex-start;margin:6px 0 12px}
.paybanner small{display:block;font-weight:500}
.sum-line{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);font-size:14.5px}
.sum-line:first-child{border-top:0}
.sum-line.tot{font-weight:700;font-size:16px}
.rchip{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-weight:600;cursor:pointer;flex:1}
.rchip[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:6px 0;cursor:pointer;min-height:44px}
.check input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--primary)}
.done-ic{width:64px;height:64px;border-radius:50%;background:var(--success-bg);color:var(--success);display:grid;place-items:center;margin:18px auto 12px}
.done-ic .ic{width:32px;height:32px;stroke-width:2.4}

/* Compare */
.cmp{max-width:1180px;margin:20px auto 0}
.cmp-h{margin-bottom:18px}
.cmp-h h2{font-size:28px;letter-spacing:-.02em}
.cmp-h p{color:var(--text-muted);max-width:76ch;margin-top:6px}
.trees{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:24px}
@media (max-width:820px){.trees{grid-template-columns:minmax(0,1fr)}}
.tree{border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:18px}
.tree.on{border-color:var(--lab-accent);box-shadow:0 0 0 2px var(--lab-accent)}
.tree-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap}
.tree-h h3{font-size:18px}
.tree-h p{font-size:13.5px;color:var(--text-muted);margin-top:2px}
.tree-stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tl{font-size:14px}
.tl>li{padding:7px 0;border-top:1px solid var(--border)}
.tl>li:first-child{border-top:0}
.tl .tt{display:flex;align-items:center;gap:8px;font-weight:650}
.tl .tk{color:var(--text-muted);font-size:13px;margin:3px 0 0 26px;line-height:1.55}
.tl .tk em{font-style:normal;font-weight:650;color:var(--text-subtle);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.mv{font-size:11px;font-weight:700;border-radius:5px;padding:0 5px;line-height:17px;white-space:nowrap}
.mv.new{background:var(--success-bg);color:var(--success)}
.mv.moved{background:var(--primary-soft);color:var(--primary)}
.mv.merged{background:var(--accent-soft);color:var(--accent)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface);margin-bottom:24px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);position:sticky;top:0}
.tbl td{padding:11px 14px;border-top:1px solid var(--border);vertical-align:top}
.tbl tr:hover td{background:var(--surface-2)}
.cmp h3.sec{font-size:18px;margin:6px 0 10px}
.qlist li{padding:10px 0;border-top:1px solid var(--border);font-size:14.5px;display:flex;gap:10px}
.qlist li:first-child{border-top:0}
.qlist .qn{font-weight:700;color:var(--accent);min-width:22px}

/* Feedback panel */
.fb-wrap{position:fixed;inset:0;z-index:90}
.fb{position:absolute;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);box-shadow:var(--shadow-lg);overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:14px}
.fb-head{display:flex;justify-content:space-between;align-items:center}
.fb-head h2{font-size:20px}
.fb-note{padding:10px 12px;border-radius:10px;background:var(--anno-bg);color:var(--anno-text);border:1px dashed var(--anno-line);font-size:13.5px;font-weight:600}
.fb-ctx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fb-ctx div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.fb-ctx span{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.fb-ctx b{font-size:13px;display:block;overflow-wrap:anywhere}
.fb-kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border:0;padding:0;margin:0}
.fb-kinds legend{font-size:13.5px;font-weight:600;margin-bottom:6px}
.fb-kind{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:60px;justify-content:center;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;font-weight:650;font-size:13.5px}
.fb-kind[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.fb-list li{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.fb-list .fbm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text-muted);margin-bottom:4px}
.fb-list p{white-space:pre-wrap;overflow-wrap:anywhere}
.fb-list .del{margin-left:auto}
.fb-copybox textarea{width:100%;min-height:160px;border:1px solid var(--border-strong);border-radius:10px;padding:10px;font-size:13px;background:var(--surface-2)}

/* Tour */
.tour-ring{position:fixed;z-index:85;border-radius:14px;box-shadow:0 0 0 3px var(--lab-accent),0 0 0 9999px var(--tour-dim);pointer-events:none;transition:top .25s ease,left .25s ease,width .25s ease,height .25s ease}
.tour-card{position:fixed;z-index:86;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(390px,calc(100vw - 32px));background:var(--lab-bg);color:var(--lab-text);border:1px solid var(--lab-line);border-radius:16px;padding:16px 16px 14px;box-shadow:var(--shadow-lg)}
.tour-card:focus-visible{outline:2px solid var(--lab-accent)}
.tour-card :focus-visible{outline-color:var(--lab-accent)}
.tour-card .tk{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--lab-accent)}
.tour-card h3{font-size:17px;margin:4px 0 6px}
.tour-card p{font-size:14px;color:var(--lab-muted);line-height:1.5}
.tour-dots{display:flex;gap:5px;margin:12px 0}
.tour-dots i{width:18px;height:4px;border-radius:2px;background:var(--lab-line)}

.tour-nav{display:flex;gap:8px;align-items:center}
.tour-nav .lab-btn{height:40px}
.tour-nav .sp{flex:1}
@media (max-width:620px){.tour-card{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto}}
@media (max-width:859px){.has-bbar .tour-card{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

/* Toasts */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 32px);pointer-events:none}

.toast{background:var(--lab-bg);color:var(--lab-text);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:var(--shadow-lg);display:flex;gap:8px;align-items:center;transition:opacity .3s,transform .3s}

/* ============ Reviewer round: bigger, more visual, less text ============ */

.nv{min-height:44px;font-size:15px}
.nv.kid{min-height:40px;font-size:14.5px}
.btn{min-height:44px;font-size:15px}
.btn-sm{min-height:38px;font-size:14px}
.chip{min-height:40px;font-size:14px}
.ph h2{font-size:30px}
.pc-top h4{font-size:17px}
.ic.dots{stroke-width:3.4}
.warnt{color:var(--warning);font-weight:650}
.hint{margin-top:16px;font-size:14px;color:var(--text-muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.linkbtn{border:0;background:none;padding:0;color:var(--primary);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.ph-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph-sub{margin-top:6px;color:var(--text-muted);font-size:15px}
details.more-i>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border-radius:999px;border:1px solid var(--border);color:var(--text-muted);font-size:13px;font-weight:600;background:var(--surface)}

.tile span:last-child{color:var(--text-muted);font-size:14px}
.tile-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);margin-bottom:8px}
.tile.warn .tile-ic{background:var(--warning-bg);color:var(--warning)}
.suggest-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;border:1px dashed var(--border-strong);background:var(--surface-2);margin-bottom:16px}
.sg-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--warning-bg);color:var(--warning);flex:none}
.sg-t{flex:1 1 220px;display:flex;flex-direction:column}
.sg-t small{color:var(--text-muted);font-size:13.5px}
.evlist{display:flex;flex-direction:column}
.evlist.cardlist{gap:12px}
.evcard{display:flex;align-items:center;gap:16px;padding:14px 18px;border-top:1px solid var(--border)}
.cardlist .evcard{border:1px solid var(--border);border-radius:16px;background:var(--surface)}

/* ================= nav helpers ================= */
const navOf=(opt,role)=>{const r=role||S.role;const n=NAVS[opt||S.opt][r==='student'?'owner':r];return typeof n==='function'?n():n;};
function mr(e,r){
  if(!e.route)return false;
  if(e.route===r)return true;
  if(e.also&&e.also.indexOf(r)>=0)return true;
  if(e.route==='programs'&&r.indexOf('program-')===0)return true;
  if(e.route==='front-desk'&&r.indexOf('attendance-')===0)return true;
  return false;
}
function locate(r,opt,role){
  const nav=navOf(opt,role);
  const all=nav.items.concat(nav.foot);
  for(const top of all){
    if(top.tabs){for(const tb of top.tabs){if(mr(tb,r))return {top,tab:tb};}}
    if(top.kids){for(const k of top.kids){if(k.route&&mr(k,r))return {top,kid:k};}}
    if(top.rare){for(const k of top.rare){if(mr(k,r))return {top,kid:k,rare:true};}}
    if(top.hub){for(const g of hubGroups())for(const k of g.items){if(k.route===r&&!k.tab)return {top,kid:k};}}
    if(mr(top,r))return {top};
  }
  return null;
}
function meta(r){
  const L=locate(r);
  const m={crumbs:[],title:'',tabs:null,activeTab:null};
  if(!L){m.title=(DESC[r]&&DESC[r].t)||'Page';if(COMMS_SUB.indexOf(r)>=0)m.crumbs=[{label:S.opt==='A'?'Communications':'Messages',href:'#comms'}];return m;}
  if(L.tab){m.title=L.top.label;m.tabs=L.top.tabs;m.activeTab=L.tab;}
  else if(L.kid&&L.kid.route===L.top.route){m.title=L.top.label;}
  else if(L.rare){m.crumbs=[{label:L.top.label,href:'#'+L.top.route}];m.title=L.kid.label;}
  else if(L.kid){m.crumbs=[{label:L.top.label,href:L.top.route?'#'+L.top.route:null}];m.title=L.kid.label;}
  else m.title=L.top.label;
  return m;
}
function trail(parent){
  const pm=meta(parent);const c=pm.crumbs.slice();
  if(pm.tabs){c.push({label:pm.title,href:'#'+pm.tabs[0].route});c.push({label:pm.activeTab.label,href:'#'+parent});}
  else c.push({label:pm.title,href:'#'+parent});
  return c;
}
function whereIs(r,opt){
  const rr=ALIAS[opt][r]||r;const L=locate(rr,opt,'owner');
  if(!L&&COMMS_SUB.indexOf(r)>=0)return (opt==='A'?'Communications':'Messages')+' › Overview (tile)';
  if(!L)return 'Not in this option’s menu';
  if(L.rare)return L.top.label+' › '+L.kid.label;
  if(L.tab)return L.top.label+' › '+L.tab.label+' (tab)';
  if(L.kid)return L.top.label+' › '+L.kid.label;
  return L.top.label;
}
const R=r=>ALIAS[S.opt][r]||r;
const roleHome=()=>({owner:'owner-home',teacher:S.tLanding,desk:'front-desk',student:'register'})[S.role];
function roleAllows(role,r){
  if(role==='student')return r==='register';
  if(role==='owner')return r!=='register';
  if(r.indexOf('attendance-')===0)return true;
  if(role==='teacher')return ['teacher-today','front-desk','p-my-schedule','p-help','p-rosters'].indexOf(r)>=0||r.indexOf('program-')===0;
  return ['front-desk','desk-notes','p-help'].indexOf(r)>=0;

    ${isOwner?`<div class="fact"><span class="fi2">${ic('wallet')}</span><div><div class="fl">Price</div><div class="fv num">$${t.price} full cycle</div><div class="fs">Drop-in $${t.dropin} when allowed</div></div></div>`:`<div class="fact"><span class="fi2">${ic('users')}</span><div><div class="fl">Last week</div><div class="fv num">${lastAtt(p)!=null?lastAtt(p)+'% attended':'—'}</div><div class="fs">Teacher view: no prices or balances</div></div></div>`}
  </div>
  <section class="card" style="margin-bottom:18px" aria-labelledby="h-weeks">

      <div><h4>Week ${sel+1} · ${fDow(d)}</h4><p class="muted" style="margin-bottom:8px">${esc(tpc)}</p>${wstat}${p.moved[sel]?`<p class="note warn" style="margin-top:10px">${ic('alert','sm')}<span>${esc(p.moved[sel])}</span></p>`:''}</div>

    ta.focus();ta.select();
    let ok=false;try{ok=document.execCommand('copy');}catch(e){ok=false;}
    toast(ok?'Copied. Paste it into an email or message to us.':'Press Ctrl+C (or ⌘C) to copy the selected text.',false);
  };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(()=>{S.fbCopy='';render();toast('Copied '+S.items.length+' note'+(S.items.length===1?'':'s')+'. Paste them into an email or message to us.',false);},fallback);
      return;
    }
  }catch(e){}
  fallback();
}

/* ================= guided tour ================= */
const TOUR=[
  {title:'A Home that fits the studio',body:'Scene Lead suggests a Home layout from what the studio runs most. The owner can switch between Classes-focused and Events-focused here. Try both.',go:()=>{S.role='owner';S.focus='classes';go('owner-home');},target:'[data-tour="focus"]'},
  {title:'Today, at a glance',body:'Big numbers, today’s classes with one action each, and at most five things that need you.',go:()=>{S.role='owner';go('owner-home');},target:'[data-tour="today"]'},
  {title:'Active is the default',body:'Day-to-day work happens in Active: current programs, this week, attendance. The Planning alternative you are viewing decides where future work lives.',go:()=>{S.role='owner';S.ptab='active';go('programs');},target:'[data-tour="ctx"],[data-tour="temporal-tabs"]'},
  {title:'Planning: only the future',body:'Future programs, schedules and drafts, with nothing current or past in the way. Draft and published stay visible, and viewing does not mean editing. Compare the workspace (A) and filters (B) from Alternatives.',go:()=>{S.role='owner';S.planTab='cycles';S.ptab='planning';go(S.planMode==='workspace'?'planning':'programs');},target:'[data-tour="planning"]'},
  {title:'One program at a glance',body:'Weeks as a stepper (4, 6 or 8 of them), attendance per week, drop-in rules that change by week, and milestones. Advanced settings stay folded.',go:()=>{S.role='owner';go('program-salsa1-c6');},target:'[data-tour="stepper"]'},
  {title:'Teacher on an iPad',body:'Instructors start with upcoming classes, teaching assignments, tasks, and big Take attendance and Roster buttons. They can pick a different start page; that is a preference, not a permission.',go:()=>{S.role='teacher';S.tScope='mine';go('teacher-today');},target:'[data-tour="take-attendance"]'},
  {title:'A student registers on a phone',body:'Level, schedule, price, drop-ins, prerequisite, refunds, places left and instructor, all before Register. Checkout is simulated.',go:()=>{S.role='student';S.reg.step=0;go('register');},target:'[data-tour="glance"]'},
  {title:'Communications dashboard',body:'Opening Communications shows a dashboard of everything you send. The menu items still work too. Features that are not live are labelled.',go:()=>{S.role='owner';go('comms');},target:'[data-tour="comms"]'},
  {title:'Compare and pick',body:'Every alternative, side by side, on the same studio data. Mark the one you prefer; it goes into your feedback list.',go:()=>{go('compare');},target:'.alt-card'}
];
function tourCard(){
  const st=TOUR[S.tour];const last=S.tour===TOUR.length-1;
  return `<div class="tour-card" id="tour-card" role="dialog" aria-modal="false" aria-labelledby="tour-h" tabindex="-1"><div class="tk">Guided tour · ${S.tour+1} of ${TOUR.length}</div><h3 id="tour-h">${esc(st.title)}</h3><p>${esc(st.body)}</p>
  <div class="tour-dots" aria-hidden="true">${TOUR.map((_,i)=>`<i class="${i<=S.tour?'on':''}"></i>`).join('')}</div>
  <div class="tour-nav"><button type="button" class="lab-btn" data-act="tour-skip">${last?'Close':'Skip tour'}</button><span class="sp"></span><button type="button" class="lab-btn" data-act="tour-back" ${S.tour===0?'disabled':''}>Back</button><button type="button" class="lab-btn primary" data-act="tour-next">${last?'Finish':'Next'}</button></div></div>`;
}
let ringRAF=0,ringUntil=0;
function placeRing(scroll){
  const ring=$('#dl-ring');if(!ring)return;
  const st=TOUR[S.tour];const el=st&&$(st.target);
  if(!el||!el.getClientRects().length){ring.hidden=true;return;}
  if(scroll){el.scrollIntoView({block:'center',inline:'nearest',behavior:reduced()?'auto':'smooth'});ringUntil=performance.now()+900;}
  const tick=()=>{
    const r=el.getBoundingClientRect();const pad=6;
    ring.hidden=false;
    ring.style.top=(r.top-pad)+'px';ring.style.left=(r.left-pad)+'px';ring.style.width=(r.width+pad*2)+'px';ring.style.height=(r.height+pad*2)+'px';
    if(performance.now()<ringUntil)ringRAF=requestAnimationFrame(tick);
  };
  cancelAnimationFrame(ringRAF);tick();
}
function tourGo(i){
  if(i<0||i>=TOUR.length){endTour();return;}
  S.tour=i;S.tourScroll=true;S.fbOpen=false;S.drawer=false;S.altOpen=false;S.helpOpen=false;
  TOUR[i].go();
}
function endTour(){S.tour=-1;const ring=$('#dl-ring');if(ring)ring.hidden=true;render();}

/* ================= toasts ================= */
function toast(msg,isSim){
  const box=$('#dl-toasts');if(!box)return;
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=(isSim===false?'':'<span class="sim">Simulated</span>')+'<span>'+esc(msg)+'</span>';
  box.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320);},3400);
}

/* ================= render & routing ================= */
function view(){
  const r=S.route;
  if(r==='owner-home')return vOwnerHome();
  if(r==='planning'){return vPlanning();}
  if(r==='year-plan'&&S.planMode==='workspace'){S.planTab='year';return vPlanning();}
  if(r==='programs'||r==='year-plan')return vPrograms();
  if(r==='comms')return vComms();
  if(r==='setup')return vSetup();
  if(r==='p-events')return vEvents();
  if(r.indexOf('program-')===0)return vProgram(r.slice(8));
  if(r.indexOf('attendance-')===0)return vAttendance(r.slice(11));
  if(r==='teacher-today')return vTeacher();
  if(r==='front-desk')return vDesk();
  if(r==='studio')return vStudio();
  if(r==='studio-details')return vStudioDetails();
  if(r==='broadcasts')return vBroadcasts();
  if(r==='desk-notes')return vDeskNotes();
  if(r==='website')return vWebsite();
  if(DESC[r])return vGeneric(r);
  return vNotFound();
}
function focusKey(el){
  if(!el||!el.closest||!el.closest('#dl-app'))return null;
  if(el.id)return '#'+cssEsc(el.id);
  const d=el.dataset||{};if(!d.act)return null;
  let s='[data-act="'+cssEsc(d.act)+'"]';
  ['v','k','n','p','r'].forEach(x=>{if(d[x]!=null)s+='[data-'+x+'="'+cssEsc(d[x])+'"]';});
  return s;
}
function measureLab(){const lab=$('#lab');if(lab)document.documentElement.style.setProperty('--lab-h',lab.offsetHeight+'px');}
function render(){
  const ae=document.activeElement;const fk=focusKey(ae);let ss=null,se=null;
  try{if(ae&&typeof ae.selectionStart==='number'){ss=ae.selectionStart;se=ae.selectionEnd;}}catch(e){}
  const keep={};$$('[data-keep-scroll]').forEach(el=>{if(el.id)keep[el.id]=el.scrollTop;});
  const root=$('#dl-root');
  let body;
  if(S.route==='compare')body=vCompare();
  else if(S.role==='student')body=vRegister();
  else body=shell(view());
  root.classList.toggle('has-bbar',S.route!=='compare'&&S.role!=='student');
  root.classList.toggle('show-notes',S.notes);
  $('#dl-app').innerHTML=labBar()+body+(S.fbOpen?fbPanel():'')+(S.helpOpen?helpPanel():'')+(S.tour>=0?tourCard():'');
  if(fk){const el=$(fk);if(el){try{el.focus({preventScroll:true});}catch(e){el.focus();}if(ss!=null){try{el.setSelectionRange(ss,se);}catch(e){}}}}
  Object.keys(keep).forEach(id=>{const el=document.getElementById(id);if(el)el.scrollTop=keep[id];});
  measureLab();
  if(S.tour>=0){const sc=S.tourScroll;S.tourScroll=false;requestAnimationFrame(()=>placeRing(sc));}
  else{const ring=$('#dl-ring');if(ring)ring.hidden=true;}
  try{document.title=screenName()+' · Scene Lead Design Lab';}catch(e){}
}
function readHash(){const h=(location.hash||'').slice(1);return /^[a-z0-9-]+$/.test(h)?h:'';}
function applyRoute(r){
  if(!r)r=roleHome();
  if(r!=='compare'){const al=ALIAS[S.opt][r];if(al)r=al;}
  if(r==='planning'&&S.planMode==='filters'){r='programs';S.ptab='planning';}
  if(r==='setup'&&S.opt==='B'&&S.setupMode==='inside')r='studio';
  if(r==='register')S.role='student';
  else if(r!=='compare'){if(S.role==='student')S.role='owner';if(!roleAllows(S.role,r))S.role='owner';}
  const changed=r!==S.route;
  S.route=r;S.drawer=false;S.labMore=false;
  return changed;
}
function afterNav(){
  if(S.tour>=0)return;
  window.scrollTo(0,0);
  const ip=$('#ipad-screen');if(ip)ip.scrollTop=0;
  const t=$('#page-title')||$('#main');if(t){try{t.focus({preventScroll:true});}catch(e){}}
}
function go(r){
  if(readHash()===r){const ch=applyRoute(r);render();if(ch)afterNav();}
  else location.hash=r;
}
window.addEventListener('hashchange',()=>{const ch=applyRoute(readHash());render();if(ch)afterNav();});

/* ================= events ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||!el.closest('#dl-app'))return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case 'alt-open':S.altOpen=!S.altOpen;S.labMore=false;render();return;
    case 'alt-close':S.altOpen=false;render();{const b=$('[data-act="alt-open"]');if(b)b.focus();}return;
    case 'alt':{
      const k=el.dataset.k;if(S[k]===v)return;const A0=ALTS.find(x=>x.k===k);
      if(k==='opt'){S.opt=v;store.set('sl-dl-opt',v);toast('Navigation: '+altLabel(A0,v),false);const al=ALIAS[v][S.route];if(al){go(al);return;}render();return;}
      S[k]=v;toast(A0.name+': '+altLabel(A0,v),false);
      if(k==='planMode'){
        if(v==='filters'&&S.route==='planning'){S.ptab='planning';go('programs');return;}
        if(v==='workspace'&&S.route==='programs'&&S.ptab==='planning'){S.ptab='active';go('planning');return;}
        if(v==='workspace')S.ptab='active';
      }
      if(k==='setupMode'&&S.route==='setup'&&S.opt==='B'&&v==='inside'){go('studio');return;}
      render();return;}
    case 'prefer':{
      const k=el.dataset.k;const A0=ALTS.find(x=>x.k===k);const lbl=altLabel(A0,el.dataset.v||S[k]);
      S.items=S.items.filter(x=>!(x.kind==='prefer'&&x.screen==='Comparison: '+A0.name));
      S.items.push({kind:'prefer',screen:'Comparison: '+A0.name,choice:lbl,opt:S.opt,role:ROLE_LBL[S.role],text:'Prefers '+lbl+' for '+A0.name+'.',name:S.fbName.trim(),alts:altSummary(),at:new Date().toISOString()});
      store.set('sl-dl-feedback',S.items);render();toast('Noted: you prefer '+lbl+'. Add a comment in Feedback if you like.',false);return;}
    case 'help':S.helpOpen=true;S.drawer=false;render();setTimeout(()=>{const t=$('.more-q summary');if(t)t.focus();},0);return;
    case 'help-close':S.helpOpen=false;render();return;
    case 'device':S.device=v;render();return;
    case 'tland':S.tLanding=v;S.tLandL=el.dataset.l;render();toast('Start page: '+el.dataset.l+'. A preference only; permissions are unchanged.',false);return;
    case 'plantab':S.planTab=v;if(S.route==='year-plan'){go('planning');return;}render();return;
    case 'pubf':S.pubF=v;render();return;
    case 'past-toggle':e.preventDefault();S.pastOpen=!S.pastOpen;render();return;
    case 'opt':{
      if(S.opt===v)return;S.opt=v;store.set('sl-dl-opt',v);
      const al=ALIAS[v][S.route];
      toast(v==='A'?'Option A: keeps the 9 areas (the reviewing studio’s preference).':'Option B: 6 areas + Settings (comparison only).',false);
      if(al){go(al);}else render();
      return;}
    case 'try':S.opt=v;store.set('sl-dl-opt',v);S.role='owner';go('owner-home');return;
    case 'notes':S.notes=!S.notes;S.labMore=false;render();return;
    case 'theme':{const next=isDark()?'light':'dark';S.theme=next;document.documentElement.setAttribute('data-theme',next);store.set('sl-dl-theme',next);S.labMore=false;render();return;}
    case 'lab-more':S.labMore=!S.labMore;render();return;
    case 'tour':S.labMore=false;tourGo(0);return;
    case 'tour-next':if(S.tour>=TOUR.length-1)endTour();else tourGo(S.tour+1);return;
    case 'tour-back':tourGo(Math.max(0,S.tour-1));return;
    case 'tour-skip':endTour();return;
    case 'fb-open':S.fbOpen=true;S.labMore=false;S.fbErr=false;render();setTimeout(()=>{const t=$('#fb-text');if(t)t.focus();},0);return;
    case 'fb-close':S.fbOpen=false;S.fbCopy='';render();{const b=$('[data-act="fb-open"]');if(b)b.focus();}return;
    case 'fb-kind':S.fbKind=v;render();return;
    case 'fb-del':S.items.splice(+v,1);store.set('sl-dl-feedback',S.items);render();toast('Note deleted.',false);return;
    case 'fb-copy':copyAll();return;
    case 'collapse':S.collapsed=!S.collapsed;render();return;
    case 'grp':{
      const k=el.dataset.k;
      if(S.collapsed){S.collapsed=false;S.open[k]=true;if(el.dataset.route)go(el.dataset.route);else render();return;}
      const L=locate(S.route);const cur=S.open[k]!=null?S.open[k]:!!(L&&L.top&&L.top.key===k);
      if(el.dataset.route&&S.route!==el.dataset.route&&!(L&&L.top&&L.top.key===k)){S.open[k]=true;go(el.dataset.route);return;}
      S.open[k]=!cur;render();return;}
    case 'drawer':S.drawer=true;render();setTimeout(()=>{const f=$('#drawer-panel .nv');if(f)f.focus();},0);return;
    case 'drawer-close':S.drawer=false;render();{const b=$('.appbar [data-act="drawer"]');if(b)b.focus();}return;
    case 'focus':S.role='desk';go('front-desk');toast('Front-desk mode: just taking the register.',false);return;
    case 'ptab':S.ptab=v;render();return;
    case 'pstyle':S.pstyle=v;render();return;
    case 'future':S.futOpen=!S.futOpen;render();return;
    case 'thr':S.threshold=+v;render();return;
    case 'year':S.year=+v;render();return;
    case 'week':S.week[el.dataset.p]=+v;render();return;
    case 'att':{const k=el.dataset.k,n=el.dataset.n;S.att[k]=S.att[k]||{};S.att[k][n]=!S.att[k][n];render();return;}
    case 'tscope':S.tScope=v;render();return;
    case 'venue':S.venue=v;S.deskCls='all';render();return;
    case 'deskcls':S.deskCls=v;render();return;
    case 'sdtab':S.sdTab=v;render();return;
    case 'webtab':S.webTab=v;render();return;
    case 'gentab':S.genTab[el.dataset.r]=v;render();return;
    case 'sim':e.preventDefault();toast(el.dataset.msg||'Prototype: nothing was saved.');return;
    case 'go':
      e.preventDefault();
      if(el.dataset.desk){S.deskCls=el.dataset.desk;S.venue='v1';}
      if(el.dataset.tab)S.sdTab=el.dataset.tab;
      if(el.dataset.web)S.webTab=el.dataset.web;
      go(el.dataset.route);return;
    case 'note-pick':S.noteStudent=v;S.noteq='';render();{const t=$('#note-text');if(t)t.focus();}return;
    case 'note-clear':S.noteStudent='';render();{const t=$('#note-q');if(t)t.focus();}return;
    case 'reg-pick':S.reg.pid=v;S.reg.step=0;S.reg.opt='full';S.reg.date=0;render();return;
    case 'reg-opt':S.reg.opt=v;if(v==='drop'){const t=BY[S.reg.pid].t;const f=dropRules(t).find(x=>x.k!=='closed');S.reg.date=f?f.a-1:0;}render();return;
    case 'reg-date':S.reg.date=+v;render();return;
    case 'reg-role':S.reg.role=v;if(S.reg.errors)delete S.reg.errors.role;render();return;
    case 'reg-next':S.reg.step=Math.min(3,S.reg.step+1);render();{const sc=$('#phone-screen');if(sc)sc.scrollTop=0;}window.scrollTo(0,0);return;
    case 'reg-back':S.reg.step=Math.max(0,S.reg.step-1);render();return;
    case 'reg-restart':S.reg.step=0;render();{const sc=$('#phone-screen');if(sc)sc.scrollTop=0;}return;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;if(!el.closest||!el.closest('#dl-app'))return;
  if(el.dataset.change==='role'){S.role=el.value;S.tour=S.tour;go(roleHome());return;}
  if(el.dataset.chk){S.reg[el.dataset.chk]=el.checked;if(S.reg.errors)delete S.reg.errors[el.dataset.chk];}
});
document.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.input)return;
  const v=el.value;
  switch(el.dataset.input){
    case 'progq':S.progq=v;render();break;
    case 'futq':S.futq=v;render();break;
    case 'setq':S.setq=v;render();break;
    case 'deskq':S.deskq=v;render();break;
    case 'attq':S.attq=v;render();break;
    case 'noteq':S.noteq=v;render();break;
    case 'notetext':S.noteText=v;break;
    case 'fbtext':S.fbDraft=v;if(S.fbErr&&v.trim()){S.fbErr=false;const er=$('#fb-err');if(er)er.textContent='';}break;
    case 'fbname':S.fbName=v;break;
    case 'reg-name':S.reg.name=v;break;
    case 'reg-email':S.reg.email=v;break;
    case 'reg-phone':S.reg.phone=v;break;
  }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest&&e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  const kind=f.dataset.form;
  if(kind==='fb'){
    const text=S.fbDraft.trim();
    if(!text){S.fbErr=true;render();const t=$('#fb-text');if(t)t.focus();return;}
    S.items.push({kind:S.fbKind,screen:screenName(),opt:S.opt,role:ROLE_LBL[S.role],text,name:S.fbName.trim(),alts:altSummary(),at:new Date().toISOString()});
    const ok=store.set('sl-dl-feedback',S.items);
    S.fbDraft='';S.fbErr=false;render();
    toast(ok?'Added to your list. It stays in this browser until you copy it.':'Added for this visit only. Copy your notes before closing the tab.',false);
    const t=$('#fb-text');if(t)t.focus();
    return;
  }
  if(kind==='profile'){toast('Prototype: studio details were not saved.');return;}
  if(kind==='broadcast'){toast('Prototype: no broadcast was sent.');return;}
  if(kind==='note'){
    if(!S.noteStudent){toast('Pick a student by name first.',false);const t=$('#note-q');if(t)t.focus();return;}
    if(!S.noteText.trim()){toast('Write the note first.',false);const t=$('#note-text');if(t)t.focus();return;}
    const u=$('#note-until');
    S.notesAdded.push({name:S.noteStudent,text:S.noteText.trim(),until:u?u.value:'Until removed',by:'You',local:true});
    S.noteStudent='';S.noteText='';render();toast('Prototype: the note is kept only in this tab.');return;
  }
  if(kind==='reg-details'){
    const R0=S.reg,E={},t=BY[R0.pid].t;
    if(!R0.name.trim())E.name='Enter your name.';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(R0.email.trim()))E.email='Enter an email like name@example.com.';
    if(!R0.role)E.role='Pick one.';
    if(t.level>=2&&!R0.pre)E.pre='Please confirm the prerequisite.';
    if(!R0.agree)E.agree='Please agree to continue.';
    R0.errors=E;
    if(Object.keys(E).length){render();const first=$('#reg-'+(E.name?'name':E.email?'email':E.pre?'pre':E.agree?'agree':'name'));if(first)first.focus();return;}
    R0.step=2;render();const sc=$('#phone-screen');if(sc)sc.scrollTop=0;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(S.tour>=0){endTour();return;}
    if(S.helpOpen){S.helpOpen=false;render();return;}
    if(S.altOpen){S.altOpen=false;render();const b=$('[data-act="alt-open"]');if(b)b.focus();return;}
    if(S.fbOpen){S.fbOpen=false;S.fbCopy='';render();const b=$('[data-act="fb-open"]');if(b)b.focus();return;}
    if(S.drawer){S.drawer=false;render();return;}
    if(S.labMore){S.labMore=false;render();return;}
  }
  const tab=e.target.closest&&e.target.closest('[role="tab"]');
  if(tab&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
    const list=$$('[role="tab"]',tab.parentElement);const i=list.indexOf(tab);
    const n=list[(i+(e.key==='ArrowRight'?1:-1)+list.length)%list.length];
    if(n){e.preventDefault();n.click();const again=$(focusKey(n));if(again)again.focus();}
  }
  if(e.key==='Tab'&&(S.drawer||S.fbOpen)){
    const box=S.fbOpen?$('.fb'):$('#drawer-panel');if(!box)return;
    const f=$$('a[href],button:not([disabled]),input,select,textarea',box).filter(x=>x.offsetParent!==null);
    if(!f.length)return;
    if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus();}
    else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus();}
  }
});
window.addEventListener('scroll',()=>{if(S.tour>=0)placeRing(false);},true);
window.addEventListener('resize',()=>{measureLab();if(S.tour>=0)placeRing(false);});
if(window.matchMedia){try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!S.theme)render();});}catch(e){}}

/* ================= boot ================= */
applyRoute(readHash());
render();
})();
</script>
