<style>
/* ===== Tokens: copied from the candidate's src/app/globals.css (light :root, --dk-* dark palette, area accents) ===== */
:root{
  --bg:#f6f7fc;--surface:#ffffff;--surface-2:#f1f3f9;--surface-3:#e8ebf5;
  --border:#dde1ec;--border-strong:#c3cade;
  --text:#131829;--text-muted:#59617a;--text-subtle:#636b85;
  --primary:#3450f0;--primary-hover:#2a41cc;--primary-soft:#eceffe;--primary-contrast:#ffffff;
  --accent:#bf4526;--accent-soft:#fdeee9;
  --success:#116e3e;--success-bg:#e3f6ec;--danger:#c0392b;--danger-bg:#fbe8e6;
  --warning:#8a5800;--warning-bg:#fdf1dc;--info:#2a41cc;--info-bg:#e9edfd;
  --text-display:1.9rem;--text-h1:1.5rem;--text-h2:1.15rem;--text-h3:1rem;--text-body:.95rem;--text-sm:.85rem;--text-xs:.78rem;
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-5:1.5rem;--space-6:2rem;
  --radius-sm:8px;--radius:12px;--radius-lg:16px;--radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(15,20,45,.05);
  --shadow:0 1px 3px rgba(15,20,45,.07),0 8px 20px -14px rgba(15,20,45,.25);
  --shadow-lg:0 2px 8px rgba(15,20,45,.06),0 20px 44px -22px rgba(15,20,45,.34);
  --focus:0 0 0 3px #3450f0;
  --studio-header-h:59px;
  --area-today:#c2410c;--area-schedule:#1d4ed8;--area-people:#047857;--area-communications:#7c3aed;
  --area-money:#a16207;--area-website:#0e7490;--area-settings:#475569;--area-help:#475569;
  /* preview chrome only (not product) */
  --lab-bg:#0b1020;--lab-surface:#161c30;--lab-line:#283049;--lab-text:#eef1f8;--lab-muted:#a7b0c8;--lab-accent:#ffb86b;--lab-on-accent:#1a1205;
  --sim-bg:#fdf1dc;--sim-text:#7a4b00;--phone-bezel:#10131c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1018;--surface:#171b25;--surface-2:#1f2431;--surface-3:#29303f;--border:#313848;--border-strong:#454e63;
    --text:#eef1f8;--text-muted:#a5aec2;--text-subtle:#8b95ab;
    --primary:#8098ff;--primary-hover:#93a8ff;--primary-soft:#1b2340;--primary-contrast:#0b0e14;
    --accent:#ff9273;--accent-soft:#3a201a;--success:#4ade80;--success-bg:#133226;--danger:#ff7b6b;--danger-bg:#3a1f1c;
    --warning:#f0c46b;--warning-bg:#35290f;--info:#8098ff;--info-bg:#1b2340;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 1px 3px rgba(0,0,0,.45);--shadow-lg:0 18px 40px -20px rgba(0,0,0,.7);--focus:0 0 0 3px #8098ff;
    --area-today:#fb923c;--area-schedule:#93c5fd;--area-people:#6ee7b7;--area-communications:#c4b5fd;--area-money:#facc15;--area-website:#67e8f9;--area-settings:#a5aec2;--area-help:#a5aec2;
    --sim-bg:#35290f;--sim-text:#f0c46b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1018;--surface:#171b25;--surface-2:#1f2431;--surface-3:#29303f;--border:#313848;--border-strong:#454e63;
  --text:#eef1f8;--text-muted:#a5aec2;--text-subtle:#8b95ab;
  --primary:#8098ff;--primary-hover:#93a8ff;--primary-soft:#1b2340;--primary-contrast:#0b0e14;
  --accent:#ff9273;--accent-soft:#3a201a;--success:#4ade80;--success-bg:#133226;--danger:#ff7b6b;--danger-bg:#3a1f1c;
  --warning:#f0c46b;--warning-bg:#35290f;--info:#8098ff;--info-bg:#1b2340;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 1px 3px rgba(0,0,0,.45);--shadow-lg:0 18px 40px -20px rgba(0,0,0,.7);--focus:0 0 0 3px #8098ff;
  --area-today:#fb923c;--area-schedule:#93c5fd;--area-people:#6ee7b7;--area-communications:#c4b5fd;--area-money:#facc15;--area-website:#67e8f9;--area-settings:#a5aec2;--area-help:#a5aec2;
  --sim-bg:#35290f;--sim-text:#f0c46b;
}
:root[data-theme="light"]{color-scheme:light}

/* ===== Base (globals.css) ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{padding:0;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5rem;letter-spacing:-.011em}
h1{font-size:var(--text-h1);font-weight:700}h2{font-size:var(--text-h2);font-weight:650}h3{font-size:var(--text-h3);font-weight:650}
p{margin:0 0 .5rem}
.container{max-width:1080px;margin:0 auto;padding:1.5rem}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.muted{color:var(--text-muted)}
.text-sm{font-size:var(--text-sm)}.text-xs{font-size:var(--text-xs)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:1.25rem}
.btn{overflow-wrap:anywhere;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font:inherit;font-weight:600;padding:.6rem 1rem;min-height:44px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;font-size:1rem}
.btn:hover:not(:disabled){background:var(--surface-2);text-decoration:none}
.btn-primary{background:var(--primary);color:var(--primary-contrast);border-color:transparent}
.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-sm{min-height:44px;padding:.4rem .8rem;font-size:.95rem}
.btn-block{width:100%}
.btn-ghost{background:transparent;border-color:transparent;color:var(--primary)}
.btn-ghost:hover:not(:disabled){background:var(--primary-soft)}
.btn-danger{background:var(--surface);border-color:var(--danger);color:var(--danger)}
.btn-toggle[aria-pressed="true"],.btn-toggle[aria-current="page"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:700;box-shadow:inset 0 0 0 1px var(--primary)}
.btn:focus-visible,a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid transparent;box-shadow:var(--focus)}
label{font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem}
input:not([type=checkbox]):not([type=radio]),select,textarea{font:inherit;width:100%;padding:.55rem .7rem;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--text);min-height:44px}
textarea{resize:vertical;min-height:90px}
input::placeholder,textarea::placeholder{color:var(--text-subtle);opacity:1}
input[type=checkbox],input[type=radio]{width:1.1rem;height:1.1rem;margin:0;accent-color:var(--primary);cursor:pointer;flex:none}
label:has(> input[type=checkbox]),label:has(> input[type=radio]){display:inline-flex;align-items:center;gap:.45rem;min-height:44px;cursor:pointer;font-weight:500}
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.15rem .55rem;border-radius:999px;font-size:.78rem;font-weight:700;border:1px solid transparent;white-space:nowrap}
.badge-present,.badge-success{background:var(--success-bg);color:var(--success)}
.badge-absent,.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-late,.badge-warning{background:var(--warning-bg);color:var(--warning)}
.badge-excused,.badge-info{background:var(--info-bg);color:var(--primary)}
.badge-neutral{background:var(--surface-2);color:var(--text-muted)}
.status-pill{padding:.25rem .7rem;font-size:var(--text-sm);border-color:currentColor}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.6rem .5rem;border-bottom:1px solid var(--border);font-size:.92rem}
th{color:var(--text-muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
thead th{background:var(--surface-2)}
.glyph{flex:none;vertical-align:middle}
.toast{padding:.75rem 1rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-sm)}

/* ===== Product app header (.appbar) ===== */
.sl-app{container-type:inline-size;container-name:sl;background:var(--bg);color:var(--text);min-height:100%}
.appbar{display:flex;justify-content:space-between;align-items:center;height:var(--studio-header-h);padding:0 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:var(--lab-h,0px);z-index:10;gap:.5rem}
.appbar__brand{font-weight:700;color:var(--primary);white-space:nowrap}
.appbar .row{gap:.5rem;flex-wrap:nowrap}
.appbar select{width:auto;max-width:11rem;min-height:44px}
.appbar__who{font-size:.85rem}
.theme-menu{position:relative}
.theme-menu>summary{list-style:none;cursor:pointer}
.theme-menu>summary::-webkit-details-marker{display:none}
.theme-menu__panel{position:absolute;right:0;z-index:20;margin-top:.25rem;min-width:14rem;padding:.75rem;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.theme-menu__panel fieldset{border:0;margin:0;padding:0}
.theme-menu__panel legend{font-weight:650;margin-bottom:.25rem}

/* ===== Studio frame (layout.tsx) ===== */
.studio-page{max-width:1400px}
.studio-head{display:flex;flex-direction:column;gap:.15rem}
.studio-head__back{font-size:var(--text-sm);align-self:flex-start;color:var(--text-muted)}
.studio-head__name{margin:0;font-size:var(--text-h1)}
.studio-head__who{margin:0;font-size:var(--text-sm)}
.studio-shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:1.5rem;align-items:start}
.studio-shell__main{min-width:0}
.studio-nav{position:sticky;top:calc(var(--lab-h,0px) + var(--studio-header-h) + .75rem);max-height:calc(100vh - var(--lab-h,0px) - var(--studio-header-h) - 1.5rem);overflow-y:auto;padding-right:.25rem;scrollbar-width:thin}
.studio-nav__bar,.studio-nav__scrim,.studio-nav__close{display:none}
.studio-nav__here{font-size:.85rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.studio-nav__presethint{margin:.4rem 0 0}
.studio-nav__focus{margin-top:.9rem}

/* ===== The rail (ui-kit.css) ===== */
.rail__list,.rail__sub{list-style:none;margin:0;padding:0}
.rail__list{display:flex;flex-direction:column;gap:2px}
.rail__row{display:flex;align-items:center;gap:2px}
.rail__link{display:flex;align-items:center;gap:var(--space-2);flex:1 1 auto;min-width:0;min-height:40px;padding:.45rem .65rem;border-radius:var(--radius-sm);color:var(--text);font-size:var(--text-body);font-weight:600;text-decoration:none}
.rail__link:hover{background:var(--surface-2);text-decoration:none}
.rail__section{--area-accent:var(--text-subtle)}
.rail__section[data-area=today]{--area-accent:var(--area-today)}.rail__section[data-area=schedule]{--area-accent:var(--area-schedule)}
.rail__section[data-area=people]{--area-accent:var(--area-people)}.rail__section[data-area=communications]{--area-accent:var(--area-communications)}
.rail__section[data-area=money]{--area-accent:var(--area-money)}.rail__section[data-area=website]{--area-accent:var(--area-website)}
.rail__section[data-area=settings]{--area-accent:var(--area-settings)}.rail__section[data-area=help]{--area-accent:var(--area-help)}
.rail__section>.rail__row>.rail__link .glyph{color:var(--area-accent)}
.rail__section[data-current=true]>.rail__row>.rail__link{background:var(--primary-soft);color:var(--primary);font-weight:700;box-shadow:inset 3px 0 0 var(--area-accent)}
.rail__section[data-current=true]>.rail__sub{border-left-color:var(--area-accent)}
.rail__toggle{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:32px;min-height:32px;padding:0;border:0;border-radius:var(--radius-sm);background:none;color:var(--text-subtle);cursor:pointer}
.rail__toggle:hover{background:var(--surface-2);color:var(--text)}
.rail__sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 var(--space-2) 1.05rem;padding-left:var(--space-3);border-left:2px solid var(--border)}
.rail__sublink{display:flex;align-items:center;gap:var(--space-2);min-height:36px;padding:.35rem .6rem;border-radius:var(--radius-sm);color:var(--text-muted);font-size:var(--text-sm);text-decoration:none}
.rail__sublink .glyph{color:var(--text-subtle)}
.rail__sublink:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.rail__sublink[aria-current=page],.rail__link[aria-current=page]{color:var(--primary);font-weight:700}
.rail__sublink[aria-current=page]{background:var(--primary-soft)}
.rail__sublink[aria-current=page] .glyph{color:var(--primary)}
.rail__sub[hidden]{display:none}
.rail__list--footer{margin-top:var(--space-3);padding-top:var(--space-2);border-top:1px solid var(--border)}
.rail__subgroup{display:flex;flex-direction:column;gap:1px;margin-top:var(--space-2)}
.rail__subhead{padding:.2rem .6rem;color:var(--text-subtle);font-size:var(--text-sm);font-weight:700}
.rail__sub--nested{margin:0;padding-left:0;border-left:0}

/* ===== Page header, sections, cards (ui-kit.css) ===== */
[data-area]{--area-accent:var(--primary)}
[data-area=today]{--area-accent:var(--area-today)}[data-area=schedule]{--area-accent:var(--area-schedule)}[data-area=people]{--area-accent:var(--area-people)}
[data-area=communications]{--area-accent:var(--area-communications)}[data-area=money]{--area-accent:var(--area-money)}[data-area=website]{--area-accent:var(--area-website)}
[data-area=settings]{--area-accent:var(--area-settings)}[data-area=help]{--area-accent:var(--area-help)}
.page-header{display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:0}
.page-header__row{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap}
.page-header__titles{min-width:0;flex:1 1 20rem}
.page-header__title{display:flex;align-items:center;gap:var(--space-2);margin:0;font-size:var(--text-h1);font-weight:700;letter-spacing:-.015em}
.page-header__icon{color:var(--area-accent,var(--primary));display:inline-flex}
.page-header__description{margin:var(--space-1) 0 0;color:var(--text-muted);font-size:var(--text-body);max-width:62ch}
.page-header__actions{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.section{display:flex;flex-direction:column;gap:var(--space-4)}
.section.card{padding:1.25rem}
.section__head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap}
.section__title{margin:0;font-size:var(--text-h2);font-weight:650}
.section__description{margin:var(--space-1) 0 0;color:var(--text-muted);font-size:var(--text-sm);max-width:68ch}
.section__body{display:flex;flex-direction:column;gap:var(--space-3);min-width:0}
.section--accent{border-left:3px solid var(--accent)}.section--warning{border-left:3px solid var(--warning)}.section--info{border-left:3px solid var(--info)}
.empty-state{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);text-align:center;padding:var(--space-6) var(--space-4);border:1px dashed var(--border-strong);border-radius:var(--radius);background:var(--surface-2)}
.empty-state__icon{color:var(--text-subtle);padding:var(--space-2);border-radius:var(--radius-pill);background:var(--surface);display:inline-flex}
.empty-state__title{font-size:var(--text-h3);font-weight:650}
.empty-state__hint{color:var(--text-muted);font-size:var(--text-sm);max-width:46ch}
.empty-state--restricted .empty-state__icon{color:var(--text-subtle)}
.task-card{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3) var(--space-4);border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm)}
.task-card__icon{margin-top:.15rem;color:var(--text-subtle)}
.task-card__body{flex:1 1 auto;min-width:0}
.task-card__title{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;font-weight:650;font-size:var(--text-h3)}
.task-card__meta{margin-top:.15rem;color:var(--text-muted);font-size:var(--text-body)}
.task-card__action{flex:0 0 auto;display:flex;gap:var(--space-2);align-items:center}
.task-card.is-muted{background:var(--surface-2);border-style:dashed}
.task-card--warning{border-left:3px solid var(--warning)}.task-card--danger{border-left:3px solid var(--danger)}.task-card--accent{border-left:3px solid var(--accent)}.task-card--info{border-left:3px solid var(--info)}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .65rem;border:1px solid var(--border);border-radius:var(--radius-pill);background:var(--surface);color:var(--text-muted);font-size:var(--text-sm);line-height:1.4}
.chip--link{color:var(--text);text-decoration:none}
.chip--link:hover{background:var(--surface-2);text-decoration:none}
.metric-grid{display:grid;gap:var(--space-3);grid-template-columns:repeat(auto-fill,minmax(min(100%,12rem),1fr))}
.metric-tile{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.metric-tile__main{display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-4) var(--space-4) var(--space-3);color:inherit;text-decoration:none;flex:1 1 auto}
.metric-tile__main:hover{text-decoration:none;background:var(--surface-2)}
.metric-tile__label{display:flex;align-items:center;gap:.4rem;color:var(--text-muted);font-size:var(--text-sm);font-weight:600}
.metric-tile__label .glyph{color:var(--text-subtle)}
.metric-tile__value{font-size:var(--text-display);font-weight:700;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric-tile__action{display:flex;align-items:center;gap:.3rem;padding:var(--space-2) var(--space-4);border-top:1px solid var(--border);color:var(--primary);font-size:var(--text-sm);font-weight:650;text-decoration:none;min-height:40px}
.metric-tile__action:hover{background:var(--primary-soft);text-decoration:none}
.data-table{width:100%;border-collapse:collapse}
.data-table th{color:var(--text-muted);background:var(--surface-2);font-size:var(--text-xs);font-weight:650;text-transform:uppercase;letter-spacing:.04em;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--border-strong);white-space:nowrap}
.data-table td{padding:var(--space-3);border-bottom:1px solid var(--border);font-size:var(--text-body);vertical-align:middle;font-variant-numeric:tabular-nums}
.data-table tbody tr:last-child td{border-bottom:0}
.data-table tbody tr:hover td{background:var(--surface-2)}
.data-table td[data-primary]{font-weight:650}
.data-table__scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.tabs{display:flex;gap:var(--space-1);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs__tab{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem .9rem;min-height:44px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:none;color:var(--text-muted);font:inherit;font-size:var(--text-sm);font-weight:650;white-space:nowrap;cursor:pointer}
.tabs__tab:hover{color:var(--text)}
.tabs__tab[aria-selected=true]{color:var(--primary);border-bottom-color:var(--primary)}
.tabs__count{padding:0 .45rem;border-radius:var(--radius-pill);background:var(--surface-3);color:var(--text-muted);font-size:var(--text-xs)}
.field{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.field__label{font-weight:650;font-size:var(--text-sm);display:flex;align-items:baseline;gap:.35rem;flex-wrap:wrap;margin:0}
.field__required{font-size:var(--text-xs);font-weight:650;color:var(--accent);text-transform:lowercase}
.field__hint{margin:0;color:var(--text-muted);font-size:var(--text-sm)}
.form-row{display:flex;flex-wrap:wrap;gap:var(--space-3) var(--space-4)}
.form-row>*{flex:1 1 14rem;min-width:0}
.form-actions{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-2)}
.state-note{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;padding:var(--space-3) var(--space-4);border-radius:var(--radius);border:1px solid var(--border);font-size:var(--text-sm)}
.state-note--warning{background:var(--warning-bg);border-color:var(--warning);color:var(--warning)}
.state-note--info{background:var(--info-bg);border-color:var(--info);color:var(--info)}
.disclosure>summary{cursor:pointer;font-weight:650;min-height:44px;display:flex;align-items:center;gap:.4rem}
.action-menu{position:relative;display:inline-block}
.action-menu>summary{list-style:none}
.action-menu>summary::-webkit-details-marker{display:none}
.action-menu__list{position:absolute;top:calc(100% + 4px);right:0;z-index:20;min-width:13rem;display:flex;flex-direction:column;padding:var(--space-1);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg)}

/* Home (ui-kit.css .home*) */
.home__top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap}
.home__context{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;min-width:0}
.home__top-actions{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.home-focus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-2)}
.home-focus__btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:56px;padding:var(--space-2) var(--space-4);border:2px solid var(--border);border-radius:var(--radius);background:var(--surface-2);color:var(--text-muted);font:inherit;font-size:1.1rem;font-weight:700;cursor:pointer}
.home-focus__btn[aria-pressed=true]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.3em}

.home__actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:var(--space-2)}
.home__actions .btn{justify-content:flex-start;text-align:left}
.home__grid{display:grid;gap:var(--space-5);grid-template-columns:minmax(0,3fr) minmax(18rem,2fr);align-items:start}
.home__list{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.home__when{font-variant-numeric:tabular-nums;white-space:nowrap;margin-right:var(--space-2)}

/* Area cards (area-pages.module.css + ui-kit .area-card) */
.area-pages{display:grid;gap:1.5rem}
.area-group{display:grid;gap:.75rem}
.area-group__title{margin:0;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle)}
.area-grid{display:grid;gap:.75rem;list-style:none;margin:0;padding:0;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr))}
.pcard{display:flex;align-items:center;gap:.85rem;min-height:4.5rem;padding:.85rem 1rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm);color:var(--text);text-decoration:none;height:100%}
.pcard:hover{border-color:var(--area-accent,var(--primary));box-shadow:var(--shadow);text-decoration:none}
.pcard[aria-current=page]{border-color:var(--area-accent,var(--primary));background:var(--surface-2)}
.pcard__icon{flex:none;display:grid;place-items:center;width:2.75rem;height:2.75rem;border-radius:.8rem;background:var(--surface-2);color:var(--area-accent,var(--primary))}
.pcard[aria-current=page] .pcard__icon{background:var(--surface)}
.pcard__text{display:grid;gap:.15rem;min-width:0}
.pcard__name{font-weight:650;font-size:1rem}
.pcard__line{font-size:.85rem;color:var(--text-subtle)}
.pcard[aria-current=page] .pcard__name,.pcard[aria-current=page] .pcard__line{text-decoration:underline}
.area-card{display:flex;align-items:flex-start;gap:var(--space-3);height:100%;min-height:72px;padding:var(--space-3) var(--space-4);border:1px solid var(--border);border-left:4px solid var(--area-accent);border-radius:var(--radius);background:var(--surface);color:var(--text);text-decoration:none}
.area-card:hover{background:var(--surface-2);text-decoration:none}
.area-card__icon{flex:none;display:inline-flex;color:var(--area-accent)}
.area-card__text{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.area-card__title{font-weight:700}
.area-card__line{color:var(--text-muted);font-size:var(--text-sm)}

/* Dialog (ui-kit .app-dialog) */
.dlg-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem}
.dlg-scrim{position:absolute;inset:0;background:rgba(11,16,32,.5)}
.app-dialog{position:relative;width:min(92vw,32rem);max-height:90%;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);color:var(--text);box-shadow:var(--shadow-lg)}
.app-dialog--wide{width:min(94vw,46rem)}
.app-dialog__panel{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-5)}
.app-dialog__title{margin:0;font-size:var(--text-h2);font-weight:650;line-height:1.3}
.app-dialog__body{color:var(--text-muted)}
.app-dialog__fields{display:flex;flex-direction:column;gap:var(--space-3)}
.app-dialog__actions{display:flex;justify-content:flex-end;gap:var(--space-2);flex-wrap:wrap;padding-top:var(--space-4);border-top:1px solid var(--border)}
.app-dialog__choice{display:flex;align-items:flex-start;gap:var(--space-2);padding:var(--space-2) var(--space-3);min-height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-weight:500}
.app-dialog__choice:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.sim-note{display:flex;gap:.5rem;align-items:flex-start;padding:.6rem .8rem;border-radius:var(--radius-sm);background:var(--sim-bg);color:var(--sim-text);font-size:var(--text-sm);font-weight:600}

/* Session cards / register */
.session{gap:.5rem;border-left:4px solid var(--area-accent,var(--primary))}
.auto-grid{display:grid;gap:var(--space-3);grid-template-columns:repeat(auto-fill,minmax(min(100%,18rem),1fr))}
.roster{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.roster li{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;padding:.6rem .8rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.roster__note{flex-basis:100%;color:var(--accent);font-size:var(--text-sm);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden}
.seg button{font:inherit;font-size:var(--text-sm);font-weight:600;min-height:40px;padding:.3rem .75rem;border:0;border-right:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--primary-soft);color:var(--primary)}

/* Website editor (editor-chrome / editor-panels, approximated) */
.studio-page--full-window{max-width:none;padding:.75rem 1rem}
.editor-frame-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:.4rem 1rem}
.editor-frame-head__name{font-size:1.15rem;margin:0}
.ed-panes{display:grid;grid-template-columns:15rem minmax(0,1fr) 18rem;gap:1rem;align-items:start}
.ed-pane{border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);padding:1rem;display:flex;flex-direction:column;gap:.6rem;min-width:0}
.ed-pane h2{font-size:1rem;margin:0;display:flex;gap:.4rem;align-items:center}
.ed-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ed-list button{width:100%;display:flex;align-items:center;gap:.5rem;min-height:40px;padding:.35rem .6rem;border:1px solid transparent;border-radius:var(--radius-sm);background:none;color:var(--text);font:inherit;font-size:var(--text-sm);text-align:left;cursor:pointer}
.ed-list button:hover{background:var(--surface-2)}
.ed-list button[aria-current=true]{background:var(--primary-soft);color:var(--primary);font-weight:700;border-color:var(--primary)}
.publish-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:.75rem;padding:.75rem;border:1px solid var(--border-strong);border-top:4px solid var(--area-website);border-radius:var(--radius);background:var(--surface)}
.publish-bar__card{display:flex;flex-direction:column;gap:.5rem;padding:.75rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2)}
.publish-bar__card h3{display:flex;gap:.4rem;align-items:center;margin:0;font-size:.95rem}
.save-flag{align-self:flex-start;padding:.2rem .6rem;border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:6px;background:var(--surface);font-size:var(--text-sm);font-weight:650}
.preview-frame{margin:0 auto;border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;background:#fff;color:#1d1a17;width:100%;transition:max-width .2s}
.site-hero{padding:2.2rem 1.4rem;background:linear-gradient(135deg,#2c2a6b,#7c3aed);color:#fff}
.site-hero.warm{background:linear-gradient(135deg,#7a3a1c,#d9822b)}
.site-hero.clean{background:#f4f5f7;color:#16181d;border-bottom:1px solid #e3e5ea}
.site-hero h3{font-size:1.6rem;margin:0 0 .3rem;color:inherit}
.site-nav{display:flex;gap:1rem;flex-wrap:wrap;padding:.6rem 1.2rem;font-size:.85rem;border-bottom:1px solid #e3e5ea;background:#fff;color:#1d1a17}
.site-sec{padding:1rem 1.4rem;border-bottom:1px solid #eee;outline-offset:-3px}
.site-sec[data-sel=true]{outline:2px dashed #3450f0}
.site-sec h4{margin:0 0 .4rem;font-size:1rem}
.site-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.6rem}
.site-cards div{border:1px solid #e3e5ea;border-radius:8px;padding:.6rem;font-size:.85rem;background:#fafafa}
.tpl-grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr))}
.tpl{display:flex;flex-direction:column;gap:.4rem;padding:.75rem;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-weight:500}

@container sl (max-width: 860px){
  .studio-shell{grid-template-columns:minmax(0,1fr)}
  .studio-nav__bar{display:flex;align-items:center;gap:.6rem;margin-bottom:.25rem}
  .studio-nav__scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
  .studio-nav{position:fixed;top:0;bottom:0;left:0;width:min(82%,320px);max-height:none;z-index:56;padding:1rem .75rem;background:var(--surface);border-right:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(-102%);visibility:hidden}

  .task-card{flex-wrap:wrap;padding:var(--space-3)}

  .btn,.btn-sm,input:not([type=checkbox]):not([type=radio]),select{min-height:48px}
}

.lab__mark{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--lab-accent);color:var(--lab-on-accent);font-size:11px;font-weight:800}

.lab__btn{display:inline-flex;align-items:center;gap:.35rem;min-height:32px;padding:.2rem .65rem;border:1px solid var(--lab-line);border-radius:7px;background:var(--lab-surface);color:var(--lab-text);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none}
.lab__btn:hover{text-decoration:none;border-color:var(--lab-accent)}
.lab__btn[aria-pressed=true],.lab__btn[aria-current=page]{background:var(--lab-accent);color:var(--lab-on-accent);border-color:var(--lab-accent)}
.lab__status{margin-left:auto;color:var(--lab-muted)}
.recon{display:flex;gap:.5rem;align-items:flex-start;padding:.55rem .8rem;border:1px dashed var(--warning);border-radius:var(--radius-sm);background:var(--warning-bg);color:var(--warning);font-size:var(--text-sm);font-weight:600}
.recon--ok{border-color:var(--success);background:var(--success-bg);color:var(--success)}
.phone-stage{display:flex;justify-content:center;padding:1.25rem .5rem 2rem;background:var(--lab-bg)}
.phone{width:410px;max-width:100%;padding:10px;border-radius:44px;background:var(--phone-bezel);box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.phone__screen{width:390px;max-width:100%;height:min(844px,calc(100vh - 9rem));overflow-y:auto;border-radius:34px;background:var(--bg);transform:translateZ(0);--lab-h:0px}
.toasts{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:.5rem;align-items:center;width:min(92vw,30rem);pointer-events:none}
.toasts .toast{display:flex;gap:.6rem;align-items:center;box-shadow:var(--shadow-lg);font-size:var(--text-sm);font-weight:600;transition:opacity .3s}
.toasts .toast.out{opacity:0}

.idx-table td,.idx-table th{vertical-align:top}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

@media (max-width: 640px){.lab{position:static}.lab__status{display:none}.appbar{top:0!important}}

</style>

}

/* AreaPages / AreaCardGroups */
function areaCards(areaKey,currentSeg,overview){
  var sec=railFor(S.role).filter(function(s){return s.key===areaKey;})[0];
  if(!sec)return '';
  var ovSeg=RAILBY[areaKey].overview;
  var groups=sec.groups.map(function(gr){return {label:gr.label,items:gr.items.filter(function(s){return s!==ovSeg;})};}).filter(function(gr){return gr.items.length;});
  var n=0;groups.forEach(function(gr){n+=gr.items.length;});
  if(n<2&&!overview)return '';
  var title=RAILBY[areaKey].label;
  var cards=function(items){return '<ul class="area-grid"'+(overview?' aria-label="'+esc(title)+'"':'')+'>'+items.map(function(seg){
    var ic=NAV_ICON[seg];
    return '<li><a class="pcard" href="'+href(segPage(seg))+'"'+(seg===currentSeg?' aria-current="page"':'')+'>'+(ic?'<span class="pcard__icon">'+g(ic,22)+'</span>':'')+'<span class="pcard__text"><span class="pcard__name">'+esc(railItemLabel(areaKey,seg,S.role))+'</span><span class="pcard__line">'+esc(BLURB[seg]||'')+'</span></span></a></li>';}).join('')+'</ul>';};
  var html=groups.map(function(gr){return gr.label?'<div class="area-group"><h3 class="area-group__title">'+esc(gr.label)+'</h3>'+cards(gr.items)+'</div>':'<div class="area-group">'+cards(gr.items)+'</div>';}).join('');
  if(overview&&areaKey==='communications'&&sec.items.indexOf('comms')>=0){
    html+='<div class="area-group"><ul class="area-grid"><li><a class="pcard" href="'+href('comms')+'"><span class="pcard__icon">'+g('rotate-ccw-clock',22)+'</span><span class="pcard__text"><span class="pcard__name">History</span><span class="pcard__line">Everything sent</span></span></a></li></ul></div>';
  }
  return '<nav class="area-pages" aria-label="'+esc(title)+' pages">'+html+'</nav>';
}

function vAttendance(){
  var r=S.role;var mine=r==='instructor'?function(s){return CLS[s.cls].t==='lh';}:function(){return true;};
  var today=SESSIONS.filter(function(s){return s.date==='Today'&&mine(s);});
  var now=today.filter(function(s){return s.state==='open'&&!S.finalized[s.id];});
  var later=today.filter(function(s){return s.state==='scheduled'&&!S.finalized[s.id];});
  var fin=today.filter(function(s){return s.state==='finalized'||S.finalized[s.id];});
  var next=SESSIONS.filter(function(s){return s.date!=='Today'&&mine(s);});
  var block=function(t,l){return l.length?'<section class="stack" aria-label="'+t+'"><h3 style="margin:0">'+t+'</h3><div class="auto-grid">'+l.map(sessionCard).join('')+'</div></section>':'';};

  h+='<section class="stack" aria-label="Today"><h3 style="margin:0">Today</h3></section>'+block('Happening now',now)+block('Later today',later)+block('Recently finalized',fin)+block('Next 7 days',next);
  return '<div class="stack" data-area="today">'+recon('attendance')+h+'</div>';
}

/* ================= routing ================= */
var ROLE_KEYS=ROLES.map(function(r){return r.key;});
function pageSeg(page){
  if(page==='home')return '';
  if(page==='site')return 'website';
  if(page.indexOf('class-')===0)return 'classes';
  if(page.indexOf('register-')===0)return 'attendance';
  if(page.indexOf('area-')===0)return null;
  return page;
}
function pageVisible(role,page){
  var vis=visibleSegs(role);
  if(page.indexOf('area-')===0){var k=page.slice(5);return railFor(role).some(function(s){return s.key===k&&s.group;});}
  if(page.indexOf('register-')===0)return can('mark',role)&&(vis.indexOf('attendance')>=0||vis.indexOf('my-teaching')>=0);
  var seg=pageSeg(page);
  return seg!==null&&NAVBY[seg]!==undefined&&vis.indexOf(seg)>=0;
}
function readHash(){var h=(location.hash||'').slice(1);return /^[a-z0-9-]+$/.test(h)?h:'';}
function applyRoute(h){
  if(h==='index'){S.page='index';return;}
  var m=h.match(/^(owner|admin|opslead|instructor|assistant|readonly)-(.+)$/);
  if(!m){S.role='owner';S.page='home';return;}
  S.role=m[1];S.page=m[2];
  if(!pageVisible(S.role,S.page)){S.blocked=S.page;S.page='home';}else S.blocked=null;
  if(S.page.indexOf('area-')===0){var k=S.page.slice(5);if(k==='today'){S.page='home';}}
}
function go(h){if(readHash()===h){applyRoute(h);render();afterNav();}else location.hash=h;}

function currentSeg(){return S.page==='index'?null:pageSeg(S.page);}
function activeKey(){

  h+='<div class="row"><a class="btn btn-primary" href="#owner-home">Open the owner view</a>'+ROLES.slice(1).map(function(r){return '<a class="btn btn-sm" href="#'+r.key+'-home">'+esc(r.label)+'</a>';}).join('')+'</div>';
  h+='<div class="data-table__scroll"><table class="data-table idx-table"><thead><tr><th>Screen</th><th>Area</th><th>Status</th><th>Open as</th><th>Basis</th></tr></thead><tbody>'+rows.map(function(r){var st=SCREEN_STATUS[r[2]];var ok=st[0]===OK;var l=link(r[3]);return '<tr><td data-primary>'+esc(r[0])+'</td><td data-label="Area">'+esc(r[1])+'</td><td data-label="Status"><span class="badge '+(ok?'badge-success':'badge-warning')+'">'+esc(st[0])+'</span></td><td data-label="Open as">'+(l||'<span class="muted">not visible to these six roles</span>')+'</td><td data-label="Basis" class="text-sm muted">'+esc(st[1])+'</td></tr>';}).join('')+'</tbody></table></div>';
  h+=section('Who sees what (from the candidate’s rules)','<p class="muted text-sm" style="margin:0">Studio tenant in “Everything” mode; private-instruction pages (Offerings, Availability, Travel, Bookings) are off for studios; Plans (legacy) hidden because the plans freeze applies. Instructors and attendance assistants get the focused menu: Home, Attendance / Check-In and My teaching.</p><div class="data-table__scroll"><table class="data-table"><thead><tr><th>Role</th><th>Areas in the sidebar</th><th>Pages</th></tr></thead><tbody>'+ROLES.map(function(r){var rail=railFor(r.key);return '<tr><td data-primary>'+esc(r.label)+'</td><td data-label="Areas">'+rail.map(function(s){return s.group?RAILBY[s.key].label:railItemLabel(s.key,s.items[0],r.key);}).join(', ')+'</td><td data-label="Pages">'+visibleSegs(r.key).length+'</td></tr>';}).join('')+'</tbody></table></div>');
  h+='<p class="muted text-sm">Not reproduced: sign-in, the public website and registration pages, the kiosk, student-facing pages, and the independent-instructor and event-organizer variants of the menu.</p></div>';
  return h;
}

/* ================= lab bar (preview chrome) ================= */
function labBar(){
  return '<div class="lab" id="lab" role="region" aria-label="Preview controls"><div class="lab__banner" role="note">Release 2 preview — candidate '+CANDIDATE+' — fictional data; actions are simulated</div><div class="lab__row"><span class="lab__brand"><span class="lab__mark" aria-hidden="true">R2</span>Scene Lead · Release 2 preview</span><label>Viewing as <select data-change="role" aria-label="Viewing as">'+ROLES.map(function(r){return '<option value="'+r.key+'"'+(S.role===r.key&&S.page!=='index'?' selected':'')+'>'+esc(r.label)+'</option>';}).join('')+'</select></label><span role="group" aria-label="Layout" style="display:inline-flex;gap:.3rem"><button type="button" class="lab__btn" data-act="frame" data-v="" aria-pressed="'+(!S.frame)+'">'+g('monitor',14)+'Fit window</button><button type="button" class="lab__btn" data-act="frame" data-v="phone" aria-pressed="'+(S.frame==='phone')+'">'+g('smartphone',14)+'Phone frame</button></span><a class="lab__btn" href="#index"'+(S.page==='index'?' aria-current="page"':'')+'>'+g('layout-grid',14)+'Screens &amp; status</a><span class="lab__status">Theme: use the app’s Theme menu (System / Light / Dark)</span></div></div>';
}

/* ================= render ================= */
function view(){
  var p=S.page;
  if(p==='home')return vHome();
  if(p.indexOf('area-')===0)return vArea(p.slice(5));
  if(p.indexOf('class-')===0)return vClass(p.slice(6));
  if(p.indexOf('register-')===0)return vRegister(p.slice(9));
  switch(p){
    case 'cycles':return vPrograms();
    case 'classes':return vClasses();
    case 'students':return vStudents();
    case 'attendance':return vAttendance();
    case 'my-teaching':return vMyTeaching();
    case 'events':return vEvents();
    case 'comms':return vComms();
    case 'templates':return vTemplates();
    case 'broadcasts':return vBroadcasts();
    case 'team':return vTeam();
    case 'settings':return vSettings();
    case 'website':return vWebsiteHub();
    case 'site':return vSite();
  }
  if(MORE[p])return MORE[p]();
  if(NAVBY[p])return vPlaceholder(p);
  return vHome();
}
function applyTheme(){
  var el=document.documentElement;
  if(S.theme==='light'||S.theme==='dark')el.setAttribute('data-theme',S.theme);else el.removeAttribute('data-theme');
}
function measureLab(){var lab=$('#lab');document.documentElement.style.setProperty('--lab-h',(lab&&!S.frame?lab.offsetHeight:0)+'px');}
function render(){
  applyTheme();
  var keepMenu=!!($('#theme-menu')&&$('#theme-menu').open);
  var app=S.page==='index'?'<div class="sl-app">'+vIndex()+'</div>':'<div class="sl-app">'+shell(view())+'</div>';
  var body=S.frame==='phone'?'<div class="phone-stage"><div class="phone"><div class="phone__screen" id="phone-screen">'+app+dialogHtml()+'</div></div></div>':app+dialogHtml();
  $('#r2-root').innerHTML=labBar()+body;
  if(keepMenu&&$('#theme-menu'))$('#theme-menu').open=true;
  measureLab();
  try{document.title=(S.page==='index'?'Screens and status':hereLabel(railFor(S.role)))+' · Release 2 preview';}catch(e){}
}
function afterNav(){
  window.scrollTo(0,0);var ps=$('#phone-screen');if(ps)ps.scrollTop=0;
  var t=$('#page-title');if(t){try{t.focus({preventScroll:true});}catch(e){}}
}
function toast(msg){
  var box=$('#r2-toasts');if(!box)return;
  var t=document.createElement('div');t.className='toast';
  t.innerHTML='<span class="sim">Simulated</span><span>'+esc(msg)+'</span>';
  box.appendChild(t);
  setTimeout(function(){t.classList.add('out');setTimeout(function(){t.remove();},320);},3600);
}

/* ================= events ================= */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  switch(a){
    case 'sim':e.preventDefault();toast(el.getAttribute('data-msg')||'Simulated — nothing is saved or sent.');return;
    case 'dlg':S.dialog={id:el.getAttribute('data-dlg'),arg:el.getAttribute('data-arg')};render();setTimeout(function(){var f=$('.app-dialog input:not([readonly]),.app-dialog select,.app-dialog textarea');if(f)f.focus();},0);return;
    case 'dlg-close':S.dialog=null;render();return;
    case 'drawer':S.drawer=!S.drawer;render();if(S.drawer){var f=$('#studio-nav a');if(f)f.focus();}return;
    case 'drawer-close':S.drawer=false;render();return;
    case 'flip':S.flips[el.getAttribute('data-k')]=!S.flips[el.getAttribute('data-k')];render();var b=$('[data-act="flip"][data-k="'+el.getAttribute('data-k')+'"]');if(b)b.focus();return;
    case 'frame':S.frame=v||null;store.set('sl-r2-frame',S.frame);render();return;
    case 'focus':S.homeFocus=v;render();return;
    case 'progws':S.progWs=v;render();return;
    case 'evtab':S.evTab=v;render();return;
    case 'toggle':var k=el.getAttribute('data-k');S[k]=!S[k];render();return;
    case 'mark':{var sid=el.getAttribute('data-s'),pn=el.getAttribute('data-p');var m=S.att[sid]||(S.att[sid]={});m[pn]=m[pn]===v?'':v;render();return;}
    case 'allpresent':{var s=SESS[v],c=CLS[s.cls];var m2=S.att[v]||(S.att[v]={});STUDENTS.slice(0,Math.min(c.en,12)).forEach(function(p){m2[p.name]='present';});render();toast('Everyone marked present (only in this preview).');return;}
    case 'savedraft':S.draftSaved=true;render();toast('Simulated — nothing is saved or sent.');return;
    case 'edpage':S.edPage=v;render();return;
    case 'edsec':S.edSection=v;S.edPage='Home';render();return;
    case 'edwidth':S.edWidth=v;render();return;
  }
});
document.addEventListener('change',function(e){
  var el=e.target;var c=el.getAttribute&&el.getAttribute('data-change');if(!c)return;
  if(c==='role'){var r=el.value;var page=S.page==='index'?'home':S.page;S.drawer=false;go(r+'-'+(pageVisible(r,page)?page:'home'));return;}
  if(c==='theme'){S.theme=el.value==='system'?null:el.value;store.set('sl-r2-theme',S.theme);render();return;}
  if(c==='studio'){el.selectedIndex=0;toast('Only one fictional studio exists in this preview.');return;}
});
document.addEventListener('input',function(e){
  var el=e.target;if(el.getAttribute&&el.getAttribute('data-input')==='search'){S.search=el.value;var pos=el.selectionStart;render();var n=$('#stu-search');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}}}
});
document.addEventListener('submit',function(e){
  var f=e.target;var k=f.getAttribute('data-form');if(!k)return;e.preventDefault();
  if(k==='dialog'){submitDialog();return;}
  if(k==='new-program')S.newProgram=false;
  if(k==='add-student')S.addStudent=false;
  if(k==='new-event')S.newEvent=false;
  render();toast('Simulated — nothing is saved or sent.');
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(S.dialog){S.dialog=null;render();return;}
  if(S.drawer){S.drawer=false;render();var b=$('[data-act="drawer"]');if(b)b.focus();}
});
window.addEventListener('hashchange',function(){S.drawer=false;S.dialog=null;applyRoute(readHash());render();afterNav();});
window.addEventListener('resize',measureLab);
if(window.matchMedia){try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(!S.theme)render();});}catch(e){}}

/* ================= boot ================= */
applyRoute(readHash()||'owner-home');
render();
})();

</script>
</body>
</html>
